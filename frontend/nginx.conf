# Minimal static hosting for the Step 24.1 frontend image.
#
# Deliberately no SPA fallback (the application has no client-side router) and
# no reverse proxy / `/api` routing: Step 24.2 owns frontend -> backend
# networking.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
