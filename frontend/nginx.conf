# Production static hosting and same-origin reverse proxy for the frontend.
#
# The browser only ever talks to this origin: the frontend is built with a
# relative API base (see frontend/src/services/apiBase.ts), so every API call is
# a same-origin `/api/...` request that nginx forwards to the backend container.
# A Docker service DNS name is never compiled into the JavaScript bundle because
# the browser cannot resolve it.
#
# There is deliberately no SPA fallback: the application has no client-side
# router.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Why this resolver + variable proxy_pass pair is used instead of a plain
    # `proxy_pass http://backend:3000;`:
    #
    # With a literal hostname, nginx resolves `backend` once, at config load, and
    # refuses to start with `host not found in upstream "backend"` whenever the
    # backend container is absent (frontend started alone, backend still
    # restarting, ...). That would make the static UI depend on backend
    # availability and couple Compose startup to a healthcheck.
    #
    # nginx only performs runtime resolution when `proxy_pass` contains a
    # variable, so the name is looked up per request through Docker's embedded
    # DNS (127.0.0.11) and cached for 10s. Behaviour: backend down -> /api
    # returns 502 while the UI keeps being served; backend back up -> /api
    # recovers without restarting nginx. `ipv6=off` avoids AAAA lookups that the
    # embedded DNS does not answer for Compose service names.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Covers every backend route (/api/health, /api/provider/test,
        # /api/chat, /api/chat/stream, /api/files) with a single block.
        set $backend_upstream "http://backend:3000";

        # When proxy_pass contains a variable, nginx does not append the
        # request URI automatically; $request_uri preserves the full original
        # path including the query string.
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE: forward provider deltas as they arrive instead of buffering the
        # whole response. This is *response* buffering; request buffering for
        # uploads is intentionally left at the nginx default.
        proxy_buffering off;
        proxy_cache off;

        # Must stay above the application-level provider timeout
        # (AI_DEFAULT_PROVIDER_TIMEOUT_MS, 120s by default) so nginx is not the
        # first timeout boundary for a slow model response. Timeouts remain
        # bounded rather than disabled.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Transport ceiling only: a 10 MiB file plus multipart framing and
        # headers, matching the Fastify request ceiling (10 MiB file limit +
        # 1 MiB margin). The authoritative file-size limit stays in the backend
        # (AI_MAX_UPLOAD_SIZE_MB, 10 MB). Raising that above 10 MB requires
        # reviewing this value and rebuilding the frontend image.
        client_max_body_size 11m;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
